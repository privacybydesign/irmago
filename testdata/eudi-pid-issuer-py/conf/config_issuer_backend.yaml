# Minimal config for the EUDI Python PID issuer backend used in irmago integration tests.
# Adapted from app/config_issuer_backend_example.yaml in
# https://github.com/eu-digital-identity-wallet/eudi-srv-web-issuing-eudiw-py
# (pinned to v0.9.4).
#
# Notes:
# - All URLs are reachable via the existing nginx tls_proxy on https://localhost:8443/eudi-pid-issuer-py.
# - The "FC" (form-based) country variant is used so the pre-auth flow does
#   not depend on an external eIDAS provider.
# - PID-SD-JWT and the age-verification mdoc (doctype eu.europa.ec.av.1) are
#   enabled for the dynamic flow. The pre-authorized flow the tests use does
#   not consult supported_credential_ids, so PID and mDL mdocs issue too.
# - Revocation is enabled; see the revocation block for why that only matters
#   while the mdoc status list tests run.

service_url: "https://localhost:8443/eudi-pid-issuer-py"

wallet_tester_url: "https://localhost:8443/eudi-pid-issuer-py"

# With revocation enabled the issuer asks take_url for a status list entry
# while it signs each credential, and embeds whatever JSON comes back as the
# credential's `status` (the MSO's for an mdoc, the SD-JWT's claims otherwise).
# It skips the AV pseudo-country itself (app/formatter_func.py).
#
# take_url points at the tls_proxy, which forwards to a status list server
# that the mdoc status list tests start inside the Go test process
# (internal/sessiontest/helper_mdoc_status_list_test.go). While no such test
# is running, nginx answers 502, and the issuer then issues without a status,
# so every other test gets the same credentials it always did. The issuer
# cannot be pointed at the test process directly: it crashes on a refused
# connection instead of issuing without status.
#
# set_url is only used by the issuer's own revocation web flow, which these
# tests do not use: they flip status bits in the test server directly.
revocation:
  take_url: "https://localhost:8443/mdoc-status-list/take"
  set_url: "https://localhost:8443/mdoc-status-list/set"
  api_key: "test-revocation-key"
  enabled: true

frontend:
  default: "default"
  frontends_config:
    "default":
      url: "https://localhost:8443/eudi-pid-issuer-py"
      metadata_signing_key_path: "/etc/eudiw/pid-issuer-dev/cert/metadata_signing.key"
      metadata_access_certificate_path: "/etc/eudiw/pid-issuer-dev/cert/metadata_signing.pem"
      metadata_signing_key_password: null

authorization_server:
  base_url: "https://localhost:8443/eudi-pid-issuer-py/oidc"
  internal_url: "http://eudi-pid-issuer-py-as.localhost:5000"
  user_verify_endpoint: "https://localhost:8443/eudi-pid-issuer-py/oidc/verify/user"

# Not used by these tests but the config schema requires the key to be present.
dynamic_presentation_url: "https://localhost:8443/eudi-pid-issuer-py/ui/presentations"

trust_validator:
  url: "https://localhost:8443/eudi-pid-issuer-py/trust"
  enabled: false

# Use standard OID4VCI scheme so irmago recognises offers.
oid4vp_scheme: "haip-vp://"
credential_offer_scheme: "openid-credential-offer://"

logging:
  backend_path: "/tmp/log_dev/logs.log"
  log_level: "DEBUG"

expiry:
  revocation_code: 60
  form: 60
  session: 60

keys:
  nonce_path: "/etc/eudiw/pid-issuer-dev/privKey/nonce_rsa2048.pem"
  credential_request_path: "/etc/eudiw/pid-issuer-dev/privKey/credential_request.pem"

trusted_CAs_path: "/etc/eudiw/pid-issuer-dev/trusted-cas/"

credential_auth_methods:
  PID_login: []
  country_selection:
    - eu.europa.ec.eudi.pid_vc_sd_jwt
    - eu.europa.ec.eudi.age_verification_mdoc

countries:
  FC:
    name: "FormEU"
    # Validity (days) added to date_of_issuance to produce date_of_expiry.
    # Pinned here rather than relying on the upstream default so a future
    # image bump cannot silently break the integration test.
    validity: 90
    keys:
      _default:
        private_key_path: "/etc/eudiw/pid-issuer-dev/privKey/issuer.key"
        private_key_password: null
        certificate_path: "/etc/eudiw/pid-issuer-dev/cert/issuer.der"
    un_distinguishing_sign: "FC"
    supported_credential_ids:
      - "eu.europa.ec.eudi.pid_vc_sd_jwt"

  # The age-verification credential is issued under its own pseudo-country: for
  # eu.europa.ec.eudi.age_verification_mdoc the issuer hardcodes country "AV"
  # (app/preauthorization.py), then looks the signing key up under
  # countries["AV"] — so without this block credential creation fails with
  # KeyError: 'AV' after the wallet has already completed the token exchange.
  # It signs with the same key as FC; only the bucket differs.
  AV:
    name: "AgeVerification"
    validity: 90
    keys:
      _default:
        private_key_path: "/etc/eudiw/pid-issuer-dev/privKey/issuer.key"
        private_key_password: null
        certificate_path: "/etc/eudiw/pid-issuer-dev/cert/issuer.der"
    un_distinguishing_sign: "AV"
    supported_credential_ids:
      # doctype eu.europa.ec.av.1. The issuer advertises every upstream
      # configuration in its metadata regardless of this list; only what is
      # listed here can actually be issued.
      - "eu.europa.ec.eudi.age_verification_mdoc"
