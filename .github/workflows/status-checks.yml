# Status checks, using the shared workflows from privacybydesign/github-workflows.
# The gate job "Status checks passed" is the one check to require.
name: Status checks

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

# A new push to a PR cancels the PR's previous run. Other events get a
# group of their own (run_id), so they never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go:
    uses: privacybydesign/github-workflows/.github/workflows/go-checks.yml@v1
    permissions:
      contents: read
    with:
      # go.mod says go 1.27; the default golangci-lint (v2.12.2) can't read it.
      golangci-lint-version: v2.15.0
      apt-packages: libsqlcipher-dev # eudi/storage/db/sqlcipher (cgo)
      # The unit tests need the services in docker-compose.yml (Postgres, MySQL,
      # SQL Server, MailHog, the Veramo/EUDI verifiers, ...), so they run in the
      # compose "test" service, as before.
      # The sessiontest package hard-codes listeners on 127.0.0.1:48680-48699.
      # Those ports sit inside Linux's default ephemeral source-port range
      # (32768-60999), so an earlier subtest's outgoing connection can land a
      # TIME_WAIT socket on one of them and cause a later ListenAndServe to
      # fail with EADDRINUSE. The test service uses network_mode: host, so
      # setting this on the runner applies to the container.
      test-command: |
        sudo sysctl -w net.ipv4.ip_local_port_range="48700 60999"
        docker compose run test -v ./...

  # Host build of the whole module (cgo/sqlcipher enabled) that both compile-checks
  # every package and produces the yivi-linux-amd64 binary the integration tests run.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install sqlcipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build artifact
        run: |
          mkdir build
          go build -o build ./...

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yivi-linux-amd64
          path: build/yivi

  # Cross-compile every release target on PRs with the same composite action the
  # Delivery workflow uses, so an unsupported GOOS/GOARCH pair (e.g. the windows/arm
  # port removed in Go 1.26) fails here instead of only after merge to master.
  build-release-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ linux, darwin, windows ]
        arch: [ amd64, 386, arm, arm64 ]
        exclude:
          - os: darwin
            arch: 386
          - os: darwin
            arch: arm
          # Go 1.26 removed the 32-bit windows/arm port (windows/arm64 remains).
          - os: windows
            arch: arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build artifact
        uses: ./.github/actions/build
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

  # The integration tests are split into two jobs, one for the client side and one for the server side.
  # They test whether irmago versions with different versions of gabi can interact.
  # We assume that the keyshare server is always kept up to date, so we don't test using older versions of the keyshare server.
  integration-test-clientside: # Checks whether irmaclient interacts with older IRMA servers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        irma-server:
          - v0.13.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install sqlcipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Run integration test
        uses: ./.github/actions/integration-test
        with:
          test-ref: ${{ github.ref }}
          irma-server-artifact: https://github.com/privacybydesign/irmago/releases/download/${{ matrix.irma-server }}/irma-linux-amd64
          keyshare-server-artifact: yivi-linux-amd64 # Current build

  integration-test-serverside: # Checks whether IRMA server interacts with older irmaclients
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        irmaclient-ref:
          - f0023141ec429d912e329665f937d05b178a3fee # v0.13.2 (integration test did not exist when version tag was created)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run integration test
        uses: ./.github/actions/integration-test
        with:
          test-ref: ${{ matrix.irmaclient-ref }}
          irma-server-artifact: yivi-linux-amd64 # Current build
          keyshare-server-artifact: yivi-linux-amd64 # Current build

  # Builds and scans the image without pushing it; Delivery pushes from master.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ghcr.io/privacybydesign/yivi
      push-image: false

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  passed:
    name: Status checks passed
    if: always()
    needs:
      - go
      - build
      - build-release-artifact
      - integration-test-clientside
      - integration-test-serverside
      - docker
      - dependency-review
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
