# Delivery: builds, scans and pushes ghcr.io/privacybydesign/yivi (linux/amd64 and
# linux/arm64), and builds the yivi binaries and attaches them to releases.
# Push to master -> :edge, release vX.Y.Z -> :X.Y.Z and :latest, manual run ->
# :<branch>. PR builds are scanned in Status checks; published images are
# re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [ master ]
  release:
    # Note: a current limitation is that when a release is edited after publication, then the Docker tags are not automatically updated.
    types: [ published ]
  workflow_dispatch:

permissions: {}

jobs:

  # Release checks; nothing is published when one of them fails.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the release is merged to master
        if: github.event_name != 'workflow_dispatch'
        env:
          SHA: ${{ github.sha }}
        run: git branch --contains "$SHA" | grep -Fx "* master"
        shell: bash

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check whether version.go contains the new version number
        if: github.event_name == 'release'
        run: grep "${GITHUB_REF_NAME:1}" version.go
        shell: bash

      - name: Check whether CHANGELOG.md contains the new version number
        if: github.event_name == 'release'
        run: grep "\[${GITHUB_REF_NAME:1}\]" CHANGELOG.md
        shell: bash

  docker:
    needs: prepare
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ghcr.io/privacybydesign/yivi
      platforms: linux/amd64,linux/arm64
      # The old Delivery tagged :latest on the latest release; keep doing so.
      tag-latest: true

  build-release-artifact:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release upload
    strategy:
      matrix:
        os: [ linux, darwin, windows ]
        arch: [ amd64, 386, arm, arm64 ]
        exclude:
          - os: darwin
            arch: 386
          - os: darwin
            arch: arm
          # Go 1.26 removed the 32-bit windows/arm port (windows/arm64 remains).
          - os: windows
            arch: arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build artifact
        uses: ./.github/actions/build
        id: build
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yivi-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.artifact-name }}

      - name: Upload artifact to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ARTIFACT: ${{ steps.build.outputs.artifact-name }}
        run: gh release upload "$TAG" "$ARTIFACT"
