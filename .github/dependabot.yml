# Updates are grouped (one PR per ecosystem) and wait 7 days after a release
# (cooldown) so compromised releases are usually yanked before they reach us.
# Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions # also bumps the shared workflows
    directories: ["/", "/.github/actions/build", "/.github/actions/integration-test"]
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker # Dockerfile and Dockerfile.test
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      docker: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go: { patterns: ["*"], update-types: [minor, patch] }
    cooldown: { default-days: 7 }
