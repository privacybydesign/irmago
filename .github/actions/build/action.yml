name: Build
description: Builds the yivi CLI tool for the given operating system and architecture.
inputs:
  os:
    description: Operating system to build for
    required: true
    default: linux
  arch:
    description: Architecture to build for
    required: true
    default: amd64
outputs:
  artifact-name:
    description: Name of the generated artifact
    value: ${{ steps.artifact-name-generator.outputs.artifact-name }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Determine artifact output filename
      id: artifact-name-generator
      env:
        OS: ${{ inputs.os }}
        ARCH: ${{ inputs.arch }}
        EXT: ${{ inputs.os == 'windows' && '.exe' || '' }}
      run: echo "artifact-name=yivi-${OS}-${ARCH}${EXT}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build
      run: go build -v -a -ldflags '-extldflags "-static"' -o ${{ steps.artifact-name-generator.outputs.artifact-name }} ./yivi
      shell: bash
      env:
        GOOS: ${{ inputs.os }}
        GOARCH: ${{ inputs.arch }}
        CGO_ENABLED: "0"
